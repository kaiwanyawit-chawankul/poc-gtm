<html>
<head>
    <title>Order Confirmation - My Web Page</title>
    <!-- Google Tag Manager -->
<script>
    window.dataLayer = window.dataLayer || [];
    (function() {
        const params = new URLSearchParams(window.location.search);
        const personaId = params.get('persona') || localStorage.getItem('gtmPersonaId') || 'guest';
        const personaName = params.get('personaName') || (personaId === 'guest' ? 'Guest' : personaId);
        const planCount = Number(params.get('planCount') || localStorage.getItem('gtmPlanCount') || 0);
        const deviceType = /iPhone|Android/.test(navigator.userAgent) ? 'mobile' : 'desktop';
        const emailDomain = params.get('emailDomain') || 'unknown';
        window.dataLayer.push({
            event: 'client_user_profile',
            user_id: params.get('userId') || localStorage.getItem('gtmUserId') || '',
            user_properties: {
                persona_id: personaId,
                persona_name: personaName,
                plan_count: Number.isFinite(planCount) ? planCount : 0,
                device_type: deviceType,
                email_domain: emailDomain
            }
        });
    })();
</script>
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

</head>
<body>
    <h1>Thank you for your purchase!</h1>
    <p>Your order is confirmed and the transaction is complete.</p>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>
    <section id="confirmationDetails"></section>
    <script>
        const params = new URLSearchParams(window.location.search);
        const transactionId = params.get('transactionId');
        const lastOrder = JSON.parse(localStorage.getItem('mockLastOrder') || '{}');
        const confirmationDetails = document.getElementById('confirmationDetails');

        if (transactionId && lastOrder.transactionId === transactionId) {
            const itemHtml = (lastOrder.items || []).map(item =>
                `<li>${item.name} — $${item.price.toFixed(2)} × ${item.quantity}</li>`
            ).join('');
            confirmationDetails.innerHTML = `<p><strong>Order ID:</strong> ${transactionId}</p><p><strong>Total:</strong> $${lastOrder.value}</p><ul>${itemHtml}</ul>`;
        } else {
            confirmationDetails.innerHTML = '<p>Order details are not available. Please return to the shop and try again.</p>';
        }
    </script>
