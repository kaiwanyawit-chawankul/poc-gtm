<body>
    <h1>Travel Mug</h1>
    <p>Keep your drinks hot or cold on the go. Mock product page for GTM testing.</p>
    <p>Price: $19.99</p>
    <p>Material: Stainless steel with vacuum insulation.</p>
    <button id="addToCart">Add to cart</button>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>
    <script>
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
            event: 'view_item',
            ecommerce: {
                currency: 'USD',
                items: [
                    {item_name: 'Travel Mug', item_id: 'mug-01', price: 19.99, item_brand: 'MockBrand', item_category: 'Home'}
                ]
            }
        });

        document.getElementById('addToCart').addEventListener('click', function() {
            const cart = JSON.parse(localStorage.getItem('mockCart') || '[]');
            let item = cart.find(entry => entry.id === 'mug-01');

            if (!item) {
                item = {
                    id: 'mug-01',
                    name: 'Travel Mug',
                    price: 19.99,
                    quantity: 1,
                    brand: 'MockBrand',
                    category: 'Home'
                };
                cart.push(item);
            } else {
                item.quantity += 1;
            }

            localStorage.setItem('mockCart', JSON.stringify(cart));

            window.dataLayer.push({
                event: 'add_to_cart',
                ecommerce: {
                    currency: 'USD',
                    value: item.price * item.quantity,
                    items: [
                        {item_name: item.name, item_id: item.id, price: item.price, quantity: item.quantity, item_brand: item.brand, item_category: item.category}
                    ]
                }
            });
            alert('Mock item added to cart.');
        });
    </script>
