<body>
    <h1>Shopping Cart</h1>
    <p>Review your mock cart and continue to checkout.</p>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>
    <section id="cartContent"></section>
    <button id="checkoutButton">Proceed to checkout</button>
    <script>
        window.dataLayer = window.dataLayer || [];
        const cart = JSON.parse(localStorage.getItem('mockCart') || '[]');
        const cartContent = document.getElementById('cartContent');
        const checkoutButton = document.getElementById('checkoutButton');

        if (cart.length === 0) {
            cartContent.innerHTML = '<p>Your cart is empty. <a href="shop.html">Go to shop</a> to add items.</p>';
            checkoutButton.disabled = true;
        } else {
            let total = 0;
            const itemsHtml = cart.map(item => {
                total += item.price * item.quantity;
                return `<li>${item.name} — $${item.price.toFixed(2)} × ${item.quantity}</li>`;
            }).join('');
            cartContent.innerHTML = `<ul>${itemsHtml}</ul><p><strong>Total:</strong> $${total.toFixed(2)}</p>`;

            window.dataLayer.push({
                event: 'view_cart',
                ecommerce: {
                    currency: 'USD',
                    items: cart.map(item => ({
                        item_name: item.name,
                        item_id: item.id,
                        price: item.price,
                        quantity: item.quantity,
                        item_brand: item.brand,
                        item_category: item.category
                    })),
                    value: total
                }
            });
        }

        checkoutButton.addEventListener('click', function() {
            window.location.href = 'checkout.html';
        });
    </script>
    <footer>
