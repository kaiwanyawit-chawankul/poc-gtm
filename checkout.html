<html>
<head>
    <title>Checkout - My Web Page</title>
    <!-- Google Tag Manager -->
    <script>
        window.dataLayer = window.dataLayer || [];
        (function() {
            const params = new URLSearchParams(window.location.search);
            const personaId = params.get('persona') || localStorage.getItem('gtmPersonaId') || 'guest';
            const personaName = params.get('personaName') || (personaId === 'guest' ? 'Guest' : personaId);
            const planCount = Number(params.get('planCount') || localStorage.getItem('gtmPlanCount') || 0);
            const ua = navigator.userAgent;
            const isTablet = /\b(iPad|Tablet|SM-T|GT-P|Xoom|SCH-I800|PlayBook|Android(?!.*Mobile))\b/i.test(ua);
            const isMobile = /\b(iPhone|Android.*Mobile|Windows Phone|BlackBerry|BB10)\b/i.test(ua);
            const isEdge = /\bEdg(e|A|iOS)\b/i.test(ua);
            const deviceType = isTablet ? 'tablet' : (isMobile ? 'mobile' : 'desktop');
            const browserName = isEdge ? 'edge' : /\b(OPR|Opera)\b/i.test(ua) ? 'opera' : /\bChrome\b/i.test(ua) ? 'chrome' : /\bSafari\b/i.test(ua) ? 'safari' : /\bFirefox\b/i.test(ua) ? 'firefox' : 'other';
            const emailDomain = params.get('emailDomain') || 'unknown';
            window.dataLayer.push({
                event: 'client_user_profile',
                user_id: params.get('userId') || localStorage.getItem('gtmUserId') || '',
                user_properties: {
                    persona_id: personaId,
                    persona_name: personaName,
                    plan_count: Number.isFinite(planCount) ? planCount : 0,
                    device_type: deviceType,
                    browser_name: browserName,
                    email_domain: emailDomain
                }
            });
        })();
    </script>
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-NR75TCK8');</script>

<!-- End Google Tag Manager -->
</head>
<body>
    <h1>Checkout</h1>
    <p>Enter your details and complete the mock purchase.</p>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>
    <section id="checkoutSummary"></section>
    <form id="checkoutForm">
        <label>
            Full name:<br>
            <input type="text" name="name" required>
        </label><br><br>
        <label>
            Email:<br>
            <input type="email" name="email" required>
        </label><br><br>
        <label>
            Shipping address:<br>
            <input type="text" name="address" required>
        </label><br><br>
        <button type="submit">Complete purchase</button>
    </form>
    <script>
        window.dataLayer = window.dataLayer || [];
        const cart = JSON.parse(localStorage.getItem('mockCart') || '[]');
        const checkoutSummary = document.getElementById('checkoutSummary');
        const checkoutForm = document.getElementById('checkoutForm');

        const buildItemData = () => cart.map(item => ({
            item_name: item.name,
            item_id: item.id,
            price: item.price,
            quantity: item.quantity,
            item_brand: item.brand,
            item_category: item.category
        }));

        if (cart.length === 0) {
            checkoutSummary.innerHTML = '<p>Your cart is empty. Please add items first.</p>';
            checkoutForm.style.display = 'none';
        } else {
            let total = 0;
            const summaryHtml = cart.map(item => {
                total += item.price * item.quantity;
                return `<li>${item.name} — $${item.price.toFixed(2)} × ${item.quantity}</li>`;
            }).join('');
            checkoutSummary.innerHTML = `<ul>${summaryHtml}</ul><p><strong>Total:</strong> $${total.toFixed(2)}</p>`;

            window.dataLayer.push({
                event: 'begin_checkout',
                ecommerce: {
                    currency: 'USD',
                    items: buildItemData(),
                    value: total
                }
            });

            let shippingEventSent = false;
            let paymentEventSent = false;

            checkoutForm.addEventListener('input', function() {
                if (shippingEventSent) {
                    return;
                }

                const formData = new FormData(checkoutForm);
                const shippingComplete = ['name', 'email', 'address'].every(fieldName => {
                    const value = (formData.get(fieldName) || '').toString().trim();
                    return value.length > 0;
                });

                if (shippingComplete) {
                    shippingEventSent = true;
                    window.dataLayer.push({
                        event: 'add_shipping_info',
                        ecommerce: {
                            currency: 'USD',
                            items: buildItemData(),
                            value: total,
                            shipping_tier: 'standard'
                        }
                    });
                }
            });

            checkoutForm.addEventListener('submit', function(event) {
                event.preventDefault();

                if (!paymentEventSent) {
                    paymentEventSent = true;
                    window.dataLayer.push({
                        event: 'add_payment_info',
                        ecommerce: {
                            currency: 'USD',
                            items: buildItemData(),
                            value: total,
                            payment_type: 'mock_card'
                        }
                    });
                }

                const transactionId = 'TX-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
                const purchaseValue = total;
                window.dataLayer.push({
                    event: 'purchase',
                    ecommerce: {
                        transaction_id: transactionId,
                        value: purchaseValue,
                        currency: 'USD',
                        items: buildItemData()
                    }
                });

                localStorage.setItem('mockLastOrder', JSON.stringify({
                    transactionId,
                    value: purchaseValue,
                    items: cart
                }));
                localStorage.removeItem('mockCart');
                window.location.href = 'order-confirmation.html?transactionId=' + encodeURIComponent(transactionId);
            });
        }
    </script>
    <footer>
        <p>&copy; 2024 My Web Page. All rights reserved.</p>
    </footer>

</body>
</html>
